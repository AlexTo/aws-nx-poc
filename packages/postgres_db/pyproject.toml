[tool.coverage.run]
branch = true
source = [ "aws_nx_poc_postgres_db" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/postgres_db/html'
 --cov-report xml:'../../coverage/packages/postgres_db/coverage.xml'
 --html='../../reports/packages/postgres_db/unittests/html/index.html'
 --junitxml='../../reports/packages/postgres_db/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "aws_nx_poc_postgres_db" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "aws-nx-poc-postgres-db"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "sqlmodel==0.0.38",
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "boto3==1.43.37",
  "aws-lambda-powertools==3.31.0"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
