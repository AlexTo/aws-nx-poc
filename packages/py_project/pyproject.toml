[tool.coverage.run]
branch = true
source = [ "aws_nx_poc_py_project" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/py_project/html'
 --cov-report xml:'../../coverage/packages/py_project/coverage.xml'
 --html='../../reports/packages/py_project/unittests/html/index.html'
 --junitxml='../../reports/packages/py_project/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "aws_nx_poc_py_project" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[tool.uv.sources.aws-nx-poc-agent-connection]
workspace = true

[tool.uv.sources.aws-nx-poc-my-sql-db]
workspace = true

[tool.uv.sources.aws-nx-poc-postgres-db]
workspace = true

[project]
name = "aws-nx-poc-py-project"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "aws-lambda-powertools==3.31.0",
  "mcp==1.28.1",
  "uvicorn==0.49.0",
  "boto3==1.43.37",
  "aws-opentelemetry-distro==0.18.0",
  "aws-nx-poc-agent-connection",
  "bedrock-agentcore==1.15.1",
  "fastapi==0.138.2",
  "strands-agents==1.45.0",
  "strands-agents-tools==0.8.2",
  "ag-ui-protocol==0.1.19",
  "ag-ui-strands==0.2.2",
  "aws-nx-poc-my-sql-db",
  "aws-nx-poc-postgres-db"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "fastapi[standard]==0.138.2" ]
