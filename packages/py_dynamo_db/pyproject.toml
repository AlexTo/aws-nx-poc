[tool.coverage.run]
branch = true
source = [ "aws_nx_poc_py_dynamo_db" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/py_dynamo_db/html'
 --cov-report xml:'../../coverage/packages/py_dynamo_db/coverage.xml'
 --html='../../reports/packages/py_dynamo_db/unittests/html/index.html'
 --junitxml='../../reports/packages/py_dynamo_db/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "aws_nx_poc_py_dynamo_db" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "aws_nx_poc.py_dynamo_db"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "pynamodb==6.1.0",
  "boto3==1.43.24",
  "aws-lambda-powertools==3.29.0"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
