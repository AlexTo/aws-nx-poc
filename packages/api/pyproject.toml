[tool.coverage.run]
branch = true
source = [ "aws_nx_poc_api" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/api/html'
 --cov-report xml:'../../coverage/packages/api/coverage.xml'
 --html='../../reports/packages/api/unittests/html/index.html'
 --junitxml='../../reports/packages/api/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "aws_nx_poc_api" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[tool.uv.sources."aws_nx_poc.py_dynamo_db"]
workspace = true

[project]
name = "aws_nx_poc.api"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.49.0",
  "aws-lambda-powertools==3.29.0",
  "aws-lambda-powertools[tracer]==3.29.0",
  "aws_nx_poc.py_dynamo_db"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "fastapi[standard]==0.136.3" ]
