packages:
  - packages/*
  - packages/common/*
allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true
  sharp: true
  '@scarf/scarf': false
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - nx
  - sharp
overrides:
  '@aws/nx-plugin': link:../nx-plugin-for-aws/dist/packages/nx-plugin
ignoreWorkspaceRootCheck: true
